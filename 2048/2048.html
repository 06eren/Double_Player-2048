<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"> <!--Css Kaynağı Font Awasome Yenıden Baslat Butonu-->

    <style>
body {
        display: flex;
        justify-content: space-around;
        align-items: center;
        height: 100vh;
        background: linear-gradient(to right, #ff7e5f, #feb47b); 
        font-family: 'Arial', sans-serif;
        position: relative;
        margin: 0;
    }
    .game-container {
        text-align: center;
    }
    h2 {
        font-size: 36px;
        font-weight: bold;
        color: #fff;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); 
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(4, 90px);
        grid-template-rows: repeat(4, 90px);
        gap: 10px;
        background-color: #bbada0;
        padding: 10px;
        border-radius: 10px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2); 
    }
    .cell {
        width: 90px;
        height: 90px;
        background: #cdc1b4;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 30px;
        font-weight: bold;
        border-radius: 5px;
        transition: all 0.2s ease;
    }
    .cell[data-value="2"] { background-color: #eee4da; color: #776e65; }
    .cell[data-value="4"] { background-color: #ede0c8; color: #776e65; }
    .cell[data-value="8"] { background-color: #f2b179; color: white; }
    .cell[data-value="16"] { background-color: #f59563; color: white; }
    .cell[data-value="32"] { background-color: #f67c5f; color: white; }
    .cell[data-value="64"] { background-color: #f65e3b; color: white; }
    .cell[data-value="128"] { background-color: #edcf72; color: white; }
    .cell[data-value="256"] { background-color: #edcc61; color: white; }
    .cell[data-value="512"] { background-color: #edc850; color: white; }
    .cell[data-value="1024"] { background-color: #edc53f; color: white; }
    .cell[data-value="2048"] { background-color: #edc22e; color: white; }
    .restart {
        position: absolute;
        top: 20px;
        right: 20px;
        cursor: pointer;
        font-size: 36px; 
        color: #ffcc00; 
        background-color: rgba(0, 0, 0, 0.6); 
        padding: 15px;
        border-radius: 50%; 
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4); 
        transition: all 0.3s ease; 
    }

    
    .restart:hover {
        background-color: #ffcc00; 
        color: #fff; 
        transform: scale(1.1); 
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6); 
    }
    
    .restart i {
        font-size: 36px; 
    }
    .message {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 20px;
        font-size: 20px;
        border-radius: 10px;
        display: none;
    }
    .score-container {
        margin-top: 20px;
        font-size: 36px; 
        font-weight: bold;
        color: #fff; 
        text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.6); 
        letter-spacing: 1px; 
    }

    .score-label {
        font-size: 32px; 
        font-weight: normal; 
        color: #fff; 
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4); 
    }

    #score1, #score2 {
        font-size: 32px; 
        font-weight: bold;
        color: #ffcc00; 
        text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5); 
        background-color: rgba(0, 0, 0, 0.4); 
        padding: 12px 25px; 
        border-radius: 10px; 
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3); 
    }
    </style>
</head>
<body>
    <div class="restart" onclick="restartGame()">
        <i class="fas fa-redo"></i> 
    </div>
    <div class="message" id="messageBox"></div>
    <div class="game-container">
        <h2>Oyuncu 1</h2>
        <div class="grid" id="grid1"></div>
        <p>Skor: <span id="score1">0</span></p>
    </div>
    <div class="game-container">
        <h2>Oyuncu 2 </h2>
        <div class="grid" id="grid2"></div>
        <p>Skor: <span id="score2">0</span></p>
    </div>
    <script>
        class Game {
            constructor(gridId, scoreId) {
                this.gridElement = document.getElementById(gridId);
                this.scoreElement = document.getElementById(scoreId);
                this.score = 0;
                this.grid = Array.from({ length: 4 }, () => Array(4).fill(0));
                this.setup();
            }
            setup() {
                this.spawnTile();
                this.spawnTile();
                this.updateGrid();
            }
            spawnTile() {
                let emptyCells = [];
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        if (this.grid[r][c] === 0) emptyCells.push([r, c]);
                    }
                }
                if (emptyCells.length > 0) {
                    let [r, c] = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    this.grid[r][c] = Math.random() < 0.9 ? 2 : 4;
                }
            }
            updateGrid() {
                this.gridElement.innerHTML = "";
                this.grid.forEach(row => {
                    row.forEach(value => {
                        const cell = document.createElement("div");
                        cell.classList.add("cell");
                        cell.setAttribute('data-value', value);
                        cell.textContent = value === 0 ? "" : value;
                        this.gridElement.appendChild(cell);
                    });
                });
                this.scoreElement.textContent = this.score;
            }
            move(direction) {
                let moved = false;
                switch (direction) {
                    case "w": 
                        moved = this.moveUp();
                        break;
                    case "s": 
                        moved = this.moveDown();
                        break;
                    case "a": 
                        moved = this.moveLeft();
                        break;
                    case "d": 
                        moved = this.moveRight();
                        break;
                    case "ArrowUp": 
                        moved = this.moveUp();
                        break;
                    case "ArrowDown": 
                        moved = this.moveDown();
                        break;
                    case "ArrowLeft": 
                        moved = this.moveLeft();
                        break;
                    case "ArrowRight": 
                        moved = this.moveRight();
                        break;
                }
                if (moved) {
                    this.spawnTile();
                    this.updateGrid();
                }
            }
            moveUp() {
                let moved = false;
                for (let c = 0; c < 4; c++) {
                    let column = this.grid.map(row => row[c]);
                    let newColumn = this.moveAndMerge(column);
                    if (newColumn.some((value, index) => value !== this.grid[index][c])) {
                        moved = true;
                        for (let r = 0; r < 4; r++) {
                            this.grid[r][c] = newColumn[r];
                        }
                    }
                }
                return moved;
            }
            moveDown() {
                let moved = false;
                for (let c = 0; c < 4; c++) {
                    let column = this.grid.map(row => row[c]).reverse();
                    let newColumn = this.moveAndMerge(column).reverse();
                    if (newColumn.some((value, index) => value !== this.grid[index][c])) {
                        moved = true;
                        for (let r = 0; r < 4; r++) {
                            this.grid[r][c] = newColumn[r];
                        }
                    }
                }
                return moved;
            }
            moveLeft() {
                let moved = false;
                for (let r = 0; r < 4; r++) {
                    let row = this.grid[r];
                    let newRow = this.moveAndMerge(row);
                    if (newRow.some((value, index) => value !== row[index])) {
                        moved = true;
                        this.grid[r] = newRow;
                    }
                }
                return moved;
            }
            moveRight() {
                let moved = false;
                for (let r = 0; r < 4; r++) {
                    let row = this.grid[r].reverse();
                    let newRow = this.moveAndMerge(row).reverse();
                    if (newRow.some((value, index) => value !== this.grid[r][index])) {
                        moved = true;
                        this.grid[r] = newRow;
                    }
                }
                return moved;
            }
            moveAndMerge(array) {
                array = array.filter(val => val !== 0);
                for (let i = 0; i < array.length - 1; i++) {
                    if (array[i] === array[i + 1]) {
                        array[i] *= 2;
                        this.score += array[i];
                        array[i + 1] = 0;
                    }
                }
                array = array.filter(val => val !== 0);
                while (array.length < 4) {
                    array.push(0);
                }
                return array;
            }

            checkGameOver() {
                let availableMoves = false;
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        if (this.grid[r][c] === 0) availableMoves = true;
                        if (r < 3 && this.grid[r][c] === this.grid[r + 1][c]) availableMoves = true;
                        if (c < 3 && this.grid[r][c] === this.grid[r][c + 1]) availableMoves = true;
                    }
                }
                return !availableMoves;
            }
        }

        function restartGame() {
            location.reload();
        }

        function checkWinner() {
            if (game1.checkGameOver() && game2.checkGameOver()) {
                const message = game1.score > game2.score ? "Oyuncu 1 Kazandı!" : (game1.score < game2.score ? "Oyuncu 2 Kazandı!" : "Beraberlik!");
                document.getElementById('messageBox').style.display = 'block';
                document.getElementById('messageBox').textContent = message;
            }
        }

        const game1 = new Game("grid1", "score1");
        const game2 = new Game("grid2", "score2");

        document.addEventListener("keydown", (e) => {
            const wasdKeys = ["w", "a", "s", "d"];
            const arrowKeys = ["ArrowUp", "ArrowLeft", "ArrowDown", "ArrowRight"];

            if (wasdKeys.includes(e.key)) {
                game1.move(e.key);
            } else if (arrowKeys.includes(e.key)) {
                game2.move(e.key);
            }

            checkWinner();
        });
    </script>
</body>
</html>
